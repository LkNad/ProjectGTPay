<!DOCTYPE html>
<html lang="ru" class="global-ui">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/icon.png">
    <title>GoToPay V2 - Market</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="index.html"><img src="images/title.png" alt=" " class="logo" width=90></a></h1>
        </header>
        
        <div class="toast"></div>
        
        <!-- Переключатель рынок / аренда -->
        <div class="market-toggle">
            <button id="normal-market-btn" class="market-btn active">Рынок</button>
            <button id="rental-market-btn" class="market-btn">Аренда</button>
        </div>
        
        <!-- Вкладки Платформа / Мои запросы (только для рынка) -->
        <div class="market-tabs" id="market-tabs" style="display: none;">
            <button class="market-tab-btn active" data-tab="platform">Платформа</button>
            <button class="market-tab-btn" data-tab="my-requests">Мои запросы</button>
        </div>
        
        <!-- Фильтры по редкости -->
        <div class="sort-container">
            <div class="filters">
                <button class="filter-btn active" data-rarity="all">Все</button>
                <button class="filter-btn" data-rarity="nameless" style="background-color: #ffd700; color: #000;">Nameless</button>
                <button class="filter-btn" data-rarity="arcane" style="background-color: #ff3333;">Arcane</button>
                <button class="filter-btn" data-rarity="legendary" style="background-color: #ff66ff;">Legendary</button>
                <button class="filter-btn" data-rarity="epic" style="background-color: #aa55ff;">Epic</button>
                <button class="filter-btn" data-rarity="rare" style="background-color: #5555ff;">Rare</button>
                <button class="filter-btn" data-rarity="uncommon" style="background-color: #0eb2d3;">Uncommon</button>
                <button class="filter-btn" data-rarity="common" style="background-color: #a5a5a5;">Common</button>
                <button class="filter-btn" data-rarity="none" style="background-color: lightgrey;">none</button>
                <button class="filter-btn" data-rarity="gold-none" style="background-color: #ffde00;">Gold none</button>
                <button class="filter-btn" data-rarity="box-none" style="background-color: #adadad;">Boxes</button>
                <button class="filter-btn" data-rarity="case-none" style="background-color: #ffc500;">Cases</button>
            </div>
            
            <div class="name-filter">
                <input type="text" id="name-filter-input" class="name-filter-input" placeholder="Поиск по названию">
                <button id="apply-name-filter">Применить</button>
                <button id="clear-name-filter">Сбросить</button>
            </div>
            
            <div class="collection-filter">
                <select id="collection-filter">
                    <option value="all">Все коллекции</option>
                </select>
            </div>
            
            <button class="sort-btn" id="sort-quantity-btn">Сортировать по количеству ↓</button>
            <button class="sort-btn" id="sort-price-btn">Сортировать по цене ↓</button>
        </div>

        <div class="items-container" id="items-container">
            <!-- Товары будут добавляться динамически -->
        </div>
        
        <!-- Баланс -->
        <div class="balance-container">
            <div class="balance-title">Баланс: <span id="balance-amount">0</span> <span style="color:gold">₽</span></div>
            <button class="edit-balance-btn" id="edit-balance-btn">Изменить</button>
        </div>

        <!-- Окно редактирования баланса -->
        <div class="balance-edit-modal" id="balance-edit-modal">
            <div class="balance-edit-content">
                <h3>Изменить баланс</h3>
                <div class="balance-display" id="balance-display">0.00</div>
                <div class="balance-keyboard">
                    <button class="balance-key" data-value="1">1</button>
                    <button class="balance-key" data-value="2">2</button>
                    <button class="balance-key" data-value="3">3</button>
                    <button class="balance-key" data-value="4">4</button>
                    <button class="balance-key" data-value="5">5</button>
                    <button class="balance-key" data-value="6">6</button>
                    <button class="balance-key" data-value="7">7</button>
                    <button class="balance-key" data-value="8">8</button>
                    <button class="balance-key" data-value="9">9</button>
                    <button class="balance-key" data-value=".">.</button>
                    <button class="balance-key" data-value="0">0</button>
                    <button class="balance-key clear" data-value="clear">×</button>
                    <button class="balance-key backspace" data-value="backspace">⌫</button>
                </div>
                <div class="balance-actions">
                    <button class="balance-cancel" id="balance-cancel">Отмена</button>
                    <button class="balance-save" id="balance-save">Сохранить</button>
                </div>
            </div>
        </div>
        
        <!-- Промокоды -->
        <div class="promocode-container">
            <button class="edit-balance-btn" id="promocode-btn">Промокоды</button>
        </div>

        <!-- Окно ввода промокода -->
        <div class="promocode-modal" id="promocode-modal" style="display: none;">
            <div class="promocode-content">
                <h3>Введите промокод</h3>
                <input type="text" id="promocode-input">
                <button id="generate-promo-btn">$</button>
                <div class="promocode-actions">
                    <button id="promocode-cancel">Отмена</button>
                    <button id="promocode-apply">Применить</button>
                </div>
                <div id="promocode-result"></div>
            </div>
        </div>
        
        <!-- Кнопка добавления предмета -->
        <div class="add-item-container">
            <button class="edit-balance-btn" id="add-item-btn">Добавить предмет</button>
        </div>

        <!-- Модальное окно добавления предмета -->
        <div class="add-item-modal" id="add-item-modal" style="display: none;">
            <div class="add-item-content">
                <h3>Добавить новый предмет</h3>
                
                <div class="form-group">
                    <label>ID предмета:</label>
                    <input type="text" id="new-item-id">
                </div>
                <div class="form-group">
                    <label>Название:</label>
                    <input type="text" id="new-item-name">
                </div>
                <div class="form-group">
                    <label>Коллекция:</label>
                    <select id="new-item-collection">
                        <option value="">Выберите коллекцию</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Количество:</label>
                    <input type="number" id="new-item-stock" min="1" value="1">
                </div>
                <div class="form-group">
                    <label>Цена:</label>
                    <input type="text" id="new-item-price" pattern="^\d+(\.\d{1,2})?$">
                </div>
                <div class="form-group">
                    <label>Изменение цены при покупке/продаже:</label>
                    <input type="number" id="new-item-price-multiply" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label>Редкость:</label>
                    <select id="new-item-rarity">
                        <option value="case-none">case</option>
                        <option value="box-none">box</option>
                        <option value="none">none</option>
                        <option value="common">Common</option>
                        <option value="uncommon">Uncommon</option>
                        <option value="rare">Rare</option>
                        <option value="epic">Epic</option>
                        <option value="legendary">Legendary</option>
                        <option value="arcane">Arcane</option>
                        <option value="nameless">Nameless</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ссылка на изображение:</label>
                    <input type="text" id="new-item-image" placeholder="images/item.png">
                </div>
                
                <div class="form-group">
                    <input type="checkbox" id="new-item-is-case">
                    <label for="new-item-is-case">Это кейс</label>
                </div>
                
                <!-- Поля для кейса -->
                <div id="case-fields" style="display: none;">
                    <h4>Редкости в кейсе</h4>
                    <div class="form-group">
                        <label>ID предметов внутри (через запятую):</label>
                        <input type="text" id="new-item-contains">
                    </div>
                    <div id="rarity-chances-container"></div>
                    <small>Сумма шансов должна быть 100%</small>
                </div>
                
                <div class="form-group">
                    <input type="checkbox" id="new-item-is-charm">
                    <label for="new-item-is-charm">Это брелок (Charm)</label>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="new-item-is-sticker">
                    <label for="new-item-is-sticker">Это наклейка (Sticker)</label>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="new-item-is-without-slot">
                    <label for="new-item-is-without-slot">Предмет без слотов</label>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="new-item-is-limited">
                    <label for="new-item-is-limited">Добавить как акцию</label>
                </div>
                
                <div class="form-actions">
                    <button id="cancel-add-item">Отмена</button>
                    <button id="confirm-add-item">Добавить</button>
                </div>
            </div>
        </div>
        
        <!-- Кнопка добавления редкости -->
        <div class="add-rarity-container">
            <button class="edit-balance-btn" id="add-rarity-btn">Добавить редкость</button>
        </div>

        <!-- Модальное окно добавления редкости -->
        <div class="add-rarity-modal" id="add-rarity-modal" style="display: none;">
            <div class="add-rarity-content">
                <h3>Добавить новую редкость</h3>
                <div class="form-group">
                    <label>ID редкости (англ.):</label>
                    <input type="text" id="new-rarity-id">
                </div>
                <div class="form-group">
                    <label>Название:</label>
                    <input type="text" id="new-rarity-name">
                </div>
                <div class="form-group">
                    <label>Цвет (hex):</label>
                    <input type="color" id="new-rarity-color" value="#ffffff">
                </div>
                <div class="form-group">
                    <label>Из какой редкости крафтится:</label>
                    <select id="new-rarity-crafts-from">
                        <option value="null">Null (не крафтится)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Во что крафтится:</label>
                    <select id="new-rarity-crafts-to">
                        <option value="null">Null (ни во что)</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button id="cancel-add-rarity">Отмена</button>
                    <button id="confirm-add-rarity">Добавить</button>
                </div>
            </div>
        </div>
        
        <!-- Модальное окно предмета (для продажи и лотов) -->
        <div class="item-detail-modal" id="item-detail-modal" style="display: none;">
            <div class="item-detail-content">
                <div class="item-detail-left">
                    <div class="item-card-mini" id="item-card-mini">
                        <!-- Мини карточка товара -->
                    </div>
                    <button class="sell-btn" id="sell-btn">Продать</button>
                </div>
                <div class="item-detail-right">
                    <div class="market-stats">
                        <div>Лотов на рынке: <span id="market-lots-count">0</span></div>
                        <div>Моих лотов: <span id="my-lots-count">0</span></div>
                        <div>В инвентаре: <span id="inventory-count">0</span></div>
                    </div>
                    
                    <!-- Запрос на покупку -->
                    <div class="buy-request-section">
                        <h4>Запрос на покупку</h4>
                        <div class="request-form">
                            <input type="number" id="request-quantity" placeholder="Количество" min="1" value="1">
                            <input type="number" id="request-price" placeholder="Цена за шт." min="0" step="0.01">
                            <button id="create-buy-request">Создать запрос</button>
                        </div>
                    </div>
                    
                    <!-- Лоты -->
                    <div class="lots-section">
                        <h4>Лоты на платформе</h4>
                        <div class="lots-list" id="lots-list">
                            <!-- Лоты будут добавлены динамически -->
                        </div>
                    </div>
                </div>
                <button class="close-modal" id="close-item-detail">×</button>
            </div>
        </div>
        
        <!-- Модальное окно продажи -->
        <div class="sell-modal" id="sell-modal" style="display: none;">
            <div class="sell-content">
                <h3>Продать предмет</h3>
                <div class="sell-inventory" id="sell-inventory">
                    <!-- Предметы инвентаря для продажи -->
                </div>
                <div class="sell-form">
                    <label>Цена продажи:</label>
                    <input type="number" id="sell-price" min="0" max="1000000" step="0.01">
                    <div class="sell-hint" id="sell-hint"></div>
                    <div class="sell-actions">
                        <button id="cancel-sell">Отмена</button>
                        <button id="confirm-sell">Выставить лот</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Модальное окно моих запросов -->
        <div class="my-requests-modal" id="my-requests-modal" style="display: none;">
            <div class="my-requests-content">
                <h3>Мои запросы</h3>
                <div class="my-requests-list" id="my-requests-list">
                    <!-- Запросы будут добавлены динамически -->
                </div>
                <button class="close-modal" id="close-my-requests">×</button>
            </div>
        </div>
        
        <!-- Кнопки прокрутки -->
        <button class="scroll-btn scroll-to-top">↑</button>
        <button class="scroll-btn scroll-to-bottom">↓</button>
    </div>
    
    <script src="items-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
